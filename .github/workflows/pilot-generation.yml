name: OpenAPI source generation pilot (no conformance claims)
on:
  workflow_dispatch:
jobs:
  generation-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Validate local corpus and normative examples
        run: |
          python -m pip install pytest
          python -m pytest -q tests
          python artifact/validate_corpus.py outputs/corpus validation/structural_audit.json
      - name: Generate 14 preselected clients per system
        # Errors are logged as structured rows. The pipeline still finishes to
        # expose logs, instead of falsely recording absent clients as failures.
        run: bash runner/bootstrap_online.sh
      - name: Upload source and generation records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etaps-generation-pilot
          path: |
            experiments/
            validation/
          retention-days: 30
